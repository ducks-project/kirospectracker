<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.38" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Knotted sack holding a ghost">
  <!-- Line-style (outlined) knotted sack holding a ghost. The artwork (drawn around the
       12,12 center with its natural extents roughly x:[4.3,19.8] y:[1.8,18.9]) is wrapped in
       a transform that recenters and scales it by ~1.26 so it nearly fills the 24x24 box like
       a native codicon, leaving only a small margin. The stroke-width is set to ~1.38 so that,
       after the 1.26 scale, the painted stroke is ~1.7 and matches the surrounding icons.
       Nothing is filled except the two ghost eyes. The ghost is an original, generic
       silhouette (not a third-party logo). -->
  <g transform="translate(12 12) scale(1.26) translate(-12 -10.35)">
    <!-- simplified knot at the top of the sack -->
    <path d="M7.4 2.3 9.2 5M16.6 2.3 14.8 5M7.4 2.3c1.3-.8 3.2-.9 4.6-.2 1.4-.7 3.3-.6 4.6.2"/>

    <!-- sack body (outline) -->
    <path d="M8.8 4.6c4.5-1.4 9.3 1 11 5.3 1.2 2.9.6 6-1.3 8.2a1.4 1.4 0 0 1-1.1.6H6.6a1.4 1.4 0 0 1-1.1-.6c-1.9-2.2-2.5-5.3-1.3-8.2 1.2-2.8 3.6-4.6 6.6-5.3Z"/>

    <!-- ghost inside the sack (outline): rounded top, wavy bottom -->
    <path d="M12 7.6c-2.6 0-4.7 2.1-4.7 4.7v4.1l1.6-1.2 1.5 1.2 1.6-1.2 1.6 1.2 1.5-1.2 1.6 1.2v-4.1c0-2.6-2.1-4.7-4.7-4.7Z"/>

    <!-- ghost eyes (filled dots) -->
    <circle cx="10.4" cy="11.4" r=".85" fill="currentColor" stroke="none"/>
    <circle cx="13.6" cy="11.4" r=".85" fill="currentColor" stroke="none"/>
  </g>
</svg>
